[pytest]
# 测试用例文件的匹配规则（默认）
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 添加命令行参数（无需每次运行都手动输入）
addopts = -s -v --alluredir=./allure-results

# 测试用例搜索路径（根据你的项目结构调整）
testpaths = tests

# 禁用警告（可选，减少日志干扰）
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# 自定义标记（如果需要给用例打标签）
markers =
    smoke: 冒烟测试（核心用例）
    ui: UI自动化用例
    test_001: 指定单独001用例
    debug: 调试用例
    test:临时测试